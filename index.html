<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal MCQ Quiz Organiser</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
<h1>Minimal MCQ Quiz Organiser</h1>

<div class="box">
<h3>Import MCQ (Paste or .txt File)</h3>
<p>Paste text or choose .txt file with exact MCQ format</p>

<textarea id="bulkInput" rows="12"></textarea>
<input type="file" id="fileInput" accept=".txt">
<button onclick="importMCQFile()">Import Questions</button>
<button class="danger" onclick="resetData()">Reset All Data</button>
</div>

<div class="box">
<h3>Quiz Play Mode</h3>

<label>Category</label>
<select id="playCategory" onchange="categoryChanged()">
<option value="">--Select--</option>
<option value="1">GK</option>
<option value="2">Geography</option>
<option value="3">History</option>
<option value="4">Economics</option>
<option value="5">Science</option>
<option value="6">Technology</option>
<option value="7">Guess - Movie</option>
<option value="8">Guess - Brand</option>
</select>

<label>Difficulty (1 / 2 / 3)</label>
<input id="playDiff">

<label>Search by Question No</label>
<input id="searchQno">
<button onclick="searchQuestion()">Find Question</button>

<button onclick="startQuiz()">Start Quiz</button>

<div id="quizArea">
<h4 id="qno"></h4>
<p id="qtext"></p>
<div id="opts"></div>

<button id="submitBtn" onclick="submitAnswer()">Submit Answer</button>
<button id="prevBtn" onclick="prevQ()">Previous</button>
<button onclick="nextQ()">Next</button>
<button onclick="markAsked()">Mark as Asked</button>
</div>
</div>

<div class="box">
<h3>All Questions (Organiser View)</h3>
<div id="askedArea"></div>
</div>
</div>

<div id="notify"></div>

<script src="script.js"></script>
</body>
</html>
